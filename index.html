const fmt=d=>d.toISOString().slice(0,10);
const tm=s=>(+s.slice(0,2))*60+(+s.slice(3,5));
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const day15=()=>{const b=new Date();b.setHours(0,0,0,0);const a=[];for(let i=0;i<15;i++){a.push(new Date(b.getTime()+i*86400000));}return a;};
const dayIdx=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000);
function trainsFor(date,frm,to){const now=new Date(),out=[];
 TT.forEach(x=>{if(!x.t[frm]||!x.t[to])return;const a=tm(x.t[frm]),b=tm(x.t[to]);if(b<=a)return;
  const dep=new Date(date+'T00:00:00');dep.setMinutes(a);
  if(dep.toDateString()===now.toDateString()&&(dep-now)<45*60000)return;
  out.push({no:x.n,dep:x.t[frm],arr:x.t[to],dur:b-a,dt:dep.toISOString()});});
 out.sort((p,q)=>tm(p.dep)-tm(q.dep));return out;}
function genId(t){const R=n=>Math.floor(Math.random()*n);
 if(t.includes('居民身份證')||t.includes('居住證'))return String(R(900000)+100000)+'********'+String(R(9000)+1000);
 if(t.includes('來往內地'))return 'H'+String(R(100000000)).padStart(8,'0');
 if(t.includes('來往大陸'))return String(R(100000000)).padStart(8,'0');
 return 'E'+String(R(100000000)).padStart(8,'0');}
const getO=()=>JSON.parse(localStorage.getItem('wk_orders')||'[]');
const setO=a=>localStorage.setItem('wk_orders',JSON.stringify(a));
function saveO(o){const a=getO(),i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);setO(a);}

 if(S.cw==null||S.cw===undefined){const i=dayIdx(S.date);S.cw=Math.min(11,Math.max(0,Math.floor(i/4)*4));}

 S.trains=trainsFor(S.date,S.dir=='out'?'香港西九龍':S.main,S.dir=='out'?S.main:'香港西九龍');setBar(bb('back'));

 if(modal=='card')m=`<div class="modal"><div class="mbox"><p style="font-size:24px">如使用感應式信用卡，請放在指定讀卡器（模擬）</p></div></div>`;
 if(modal=='child')m=`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">登記免費乘車小童：請選擇證件</p>
  <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.kidType='${t}';sum('childscan')"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div>
  <div style="text-align:center"><button class="btn" onclick="sum(null)">取消</button></div></div></div>`;
 if(modal=='childscan')m=`<div class="modal"><div class="mbox"><p style="font-size:24px">請跟隨指示掃瞄小童的證件（模擬）</p></div></div>`;
 go(sumBase()+
  (!modal?`<div style="position:absolute;left:60px;bottom:40px"><button class="btn" ${((S.kids||[]).length)>=S.adult?'disabled':''} onclick="sum('child')">添加免費乘車兒童</button></div>`:'')+m);
 if(modal=='scan')setTimeout(function(){S.pax.push({id_type:S.paxType,id_no:genId(S.paxType)});S.paxType=null;S.pi++;
   if(S.pi<S.adult+S.child){sum('id');}else{sum(null);}},2500);
 if(modal=='childscan')setTimeout(function(){S.kids=S.kids||[];S.kids.push({id_type:S.kidType,id_no:genId(S.kidType)});S.kidType=null;sum(null);},2500);

async function printing(){const t=S.trains[S.sel],T=totals();
 const o={id:Date.now(),no:'',created_at:new Date().toLocaleString('zh-HK'),travel_date:S.date,
  from_station:S.dir=='out'?'香港西九龍':S.main,to_station:S.dir=='out'?S.main:'香港西九龍',
  train_no:t.no,dep_time:t.dep,arr_time:t.arr,dep_dt:t.dt,coach_class:S.cls,qty:S.adult+S.child,
  unit_price:T.u,total:T.total,payment_method:S.pay,passengers:S.pax,free_children:S.kids||[],
  slipPrints:0,receiptPrinted:false};
 o.no='WK'+S.date.replace(/-/g,'')+String(o.id).slice(-4);saveO(o);
 setBar(bb('cancel'));
 go(sumBase()+printModalHTML(1,1,0));
 await slipPrintRaw();o.slipPrints=1;saveO(o);

 await receiptPrint();o.receiptPrinted=true;saveO(o);

function recollect(){setBar(bb('back'));S.pick=S.pick||{};const a=getO().slice().reverse().slice(0,8);
 const ids=Object.keys(S.pick).filter(k=>S.pick[k]);
 go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px">
 <p style="margin:10px;font-size:22px">請選擇要領取的訂單（可多選；開車前可重複領取，每單只限印發兩次；不會列印收據）</p>
 ${a.map(o=>{const ok=o.slipPrints<2&&new Date(o.dep_dt)>new Date();const on=!!S.pick[o.id];
  return `<button class="btn" style="display:block;width:100%;margin:10px 0;${on?'background:#f08c1e':''}" ${ok?'':'disabled'} onclick="togPick(${o.id})">${on?'✔ ':''}${o.no}　${o.travel_date} ${o.train_no}（已印 ${o.slipPrints}/2）</button>`;}).join('')||'<p style="margin:14px">沒有訂單</p>'}
 ${ids.length?`<button class="btn orange" style="margin-top:16px" onclick="startQueue()">確認列印（${ids.length}張）</button>`:''}
 </div>`);}
function togPick(id){S.pick[id]=!S.pick[id];recollect();}
async function startQueue(){const ids=Object.keys(S.pick).filter(k=>S.pick[k]).map(Number);S.pick={};
 for(let i=0;i<ids.length;i++){const o=getO().find(x=>x.id===ids[i]);if(!o)continue;
  go(printModalHTML(ids.length,i+1,ids.length-i-1));
  await slipPrintRaw();o.slipPrints++;saveO(o);
  await wait(2600);}
 recollect();}
function childFlow(){const os=getO().slice().reverse().slice(0,8);setBar(bb('back'));
 if(!S.cf){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">無論於任何購票途徑購票時，如未有登記同行免費乘車小童，亦可於售票機後補登記手續</p><button class="btn" onclick="S.cf=1;childFlow()">添加</button></div>`);return;}
 if(!S.cfOrder){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">步驟一：選擇同行成人車票</p>
  ${os.map(o=>`<button class="btn" style="display:block;width:100%;margin:10px 0" onclick="S.cfOrder=${o.id};S.paxType=null;S.cfScan1=0;S.cfScan2=0;S.kidType=null;childFlow()">${o.no} ${o.travel_date} ${o.train_no} ×${o.qty}</button>`).join('')||'<p>沒有訂單</p>'}</div>`);return;}
 if(!S.cfScan1){
  if(!S.paxType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">選擇同行成人購票時的證件類別</p>
   <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.paxType='${t}';childFlow()"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請於相關閱讀器掃瞄證件/刷卡（模擬）</p></div></div>`);
  setTimeout(function(){S.cfScan1=1;S.paxType=null;childFlow();},2500);return;}
 if(!S.cfScan2){
  if(!S.kidType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">步驟二：登記同行小童證件</p>
   <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.kidType='${t}';childFlow()"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請跟隨指示掃瞄小童的證件（模擬）</p></div></div>`);
  setTimeout(function(){const o=getO().find(x=>x.id===S.cfOrder);
   if(o.free_children.length>=o.qty){S.kidType=null;notice('每位18歲或以上的旅客只可登記一位免費乘車小童');return;}
   o.free_children.push({id_type:S.kidType,id_no:genId(S.kidType)});saveO(o);S.kidType=null;S.cfScan2=1;childFlow();},2500);return;}
 setBar(bb('back'));go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:24px">步驟三：完成添加<br>完成程序後請取回證件</p><button class="btn" onclick="home()">確定</button></div>`);}
home();
</script>
</body>
</html>
