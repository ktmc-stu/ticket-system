<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>香港西九龍站售票機</title>
<style>
*{box-sizing:border-box;user-select:none;font-family:"Microsoft JhengHei",sans-serif;margin:0}
html,body{height:100%;overflow:hidden;background:#e8edf3}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;flex:none;background:#eef3f8;display:flex;flex-direction:column;transform-origin:center center}
.topbar{background:#3e75b8;min-height:60px;flex:none;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.tb{background:#3d7ab8;color:#fff;border:2px solid #fff;border-radius:8px;padding:8px 26px;font-size:22px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tb img{width:30px;height:30px}
.tb .two{line-height:1.05;font-size:19px;text-align:left}
.bar{background:#3e75b8;height:56px;flex:none}
#app{flex:1;position:relative;overflow:hidden}
.ic{width:64px;height:64px;object-fit:contain}
.hgrid{position:absolute;inset:0;padding:70px 80px;display:grid;grid-template-columns:95fr 70fr 93fr 92fr;grid-template-rows:300px 300px 1fr;gap:24px}
.hb{border:none;border-radius:10px;color:#fff;font-size:44px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:26px;justify-content:center;background:#3d7ab8}
.hb .ic{width:96px;height:96px}
.hb.green{background:#3fa142}.hb.yellow{background:#e8b40b}
.hb.tall{flex-direction:column;grid-column:4;grid-row:1/3}
.lang{grid-column:4;grid-row:3;align-self:end;justify-self:end;width:auto;padding:16px 36px;font-size:24px}
.pdwrap{position:absolute;left:90px;right:90px;top:45px;height:730px}
.pdpa{position:absolute;inset:0;background:#f8fafc;padding:50px 80px;font-size:19px;line-height:1.9}
.pdpa h3{color:#f08c1e;text-align:center;font-size:26px;margin-bottom:20px}
.pnum{position:absolute;right:20px;top:14px;font-size:18px;color:#666}
.side{position:absolute;right:-16px;top:80px;writing-mode:vertical-lr;background:#3d7ab8;color:#fff;padding:20px 10px;border-radius:8px;cursor:pointer;font-size:20px;letter-spacing:6px}
.pdbtns{position:absolute;left:0;right:0;bottom:70px;text-align:center}
.panel{background:#fff;border:3px solid #3e75b8;border-radius:8px;position:absolute}
.tab{position:absolute;top:-3px;left:50px;background:#3e75b8;color:#fff;padding:8px 90px 8px 30px;font-size:20px;border-radius:0 0 14px 0}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:70px 24px 0}
.st{background:#fff;border:2px solid #7aa7d4;border-radius:6px;padding:12px 4px;text-align:center;cursor:pointer;font-size:20px;line-height:1.2;height:96px}
.st small{display:block;font-size:11px;color:#666}
.st.sel{background:#f08c1e;border-color:#f08c1e;color:#fff}.st.sel small{color:#fff}
.rcol{position:absolute;width:230px}
.lb{color:#3e75b8;font-size:18px;margin:14px 0 6px}
.fbox{background:#fff;border:2px solid #7aa7d4;border-radius:6px;padding:12px;text-align:center;font-size:20px;cursor:pointer}
.fbox small{display:block;font-size:11px;color:#666}
.fbox.sel{border-color:#f08c1e;color:#f08c1e;background:#fff8f0}.fbox.sel small{color:#f08c1e}
.btn{background:#3d7ab8;color:#fff;border:none;border-radius:8px;padding:14px 34px;font-size:22px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.orange{background:#f5a623}
.trow{display:flex;align-items:center;gap:16px;border:2px solid #7aa7d4;border-radius:6px;padding:12px;margin:10px 14px;cursor:pointer;font-size:19px;background:#fff}
.trow.sel{border-color:#f08c1e;background:#fff7ee}
.trow .ar{color:#3e75b8;font-size:13px;text-align:center}
.chip{display:inline-block;border:2px solid #7aa7d4;border-radius:6px;padding:4px 12px;margin:0 5px;text-align:center;cursor:pointer;background:#fff;font-size:13px}
.chip b{display:block;font-size:24px}
.chip.sel{border-color:#f08c1e;background:#f08c1e;color:#fff}
.qty{display:flex;align-items:center;gap:22px;font-size:26px;margin:30px 40px}
.circ{width:56px;height:56px;border-radius:50%;border:2px solid #3d7ab8;background:#fff;color:#3d7ab8;font-size:30px;cursor:pointer}
.nbox{border:2px solid #7aa7d4;border-radius:6px;padding:10px 40px;font-size:26px;background:#fff}
.cls{background:#fff;border:2px solid #7aa7d4;border-radius:6px;padding:16px;margin:14px 0;cursor:pointer;font-size:22px;text-align:center}
.cls small{font-size:13px;color:#666}
.cls.sel{border-color:#f08c1e;color:#f08c1e}.cls.sel small{color:#f08c1e}
.red{color:#e33;font-size:18px}
.modal{position:absolute;inset:0;background:rgba(120,120,120,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:#fff;border-radius:10px;padding:34px;min-width:560px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.idg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.idb{background:#3d7ab8;color:#fff;border:none;border-radius:8px;padding:22px 10px;font-size:19px;cursor:pointer;line-height:1.4}
.idb img{display:block;margin:0 auto 10px}
.suml{border:2px solid #7aa7d4;border-radius:6px;padding:16px;background:#fff;font-size:20px}
.pbox{border:2px solid #7aa7d4;border-radius:6px;padding:10px 18px;background:#fff;font-size:20px;margin:10px 0;text-align:right}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{size:80mm 210mm;margin:0}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
 <div class="topbar" id="tbar"></div>
 <div id="app"></div>
 <div class="bar"></div>
</div></div>
<div id="printArea"></div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='scale('+s+')';}
window.onresize=fit;fit();
document.addEventListener('error',function(e){if(e.target&&e.target.tagName=='IMG')e.target.style.display='none';},true);
const ST=[["香港西九龍","HongKongWestKowloon"],["福田","Futian"],["深圳北","Shenzhenbei"],["光明城","Guangmingcheng"],["虎門","Humen"],["慶盛","Qingsheng"],["東莞東","Dongguandong"],["常平","Changping"],["東莞","Dongguan"],["廣州南","Guangzhounan"],["廣州東","Guangzhoudong"],["三水南","Sanshuinan"],["上海虹橋","Shanghai Hongqiao"],["上饒","Shangrao"],["天津西","Tianjinxi"],["北京西","Beijingxi"],["白洋淀","Baiyangdian"],["石家莊","Shijiazhuang"],["汕尾","Shanwei"],["汕頭","Shantou"]];
const IDS=["中國居民身份證","港澳居民居住證","外國人永久居留身份證","港澳居民來往內地通行證","台灣居民來往大陸通行證","按規定可使用的有效護照"];
let S={},IDLE;
const $=q=>document.querySelector(q);
const go=h=>{$('#app').innerHTML=h;clearTimeout(IDLE);IDLE=setTimeout(home,120000);};
const setBar=h=>{document.getElementById('tbar').innerHTML=h;};
const bb=l=>`<button class="tb" onclick="${l=='cancel'?'home()':'back()'}">${l=='cancel'?'取消交易':'〈 上一步'}</button><button class="tb" onclick="home()"><img src="img/top-home.png"><span class="two">首頁<br>Home</span></button>`;
const fmt=d=>d.toISOString().slice(0,10);
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const day15=()=>{const b=new Date();b.setHours(0,0,0,0);const a=[];for(let i=0;i<15;i++){a.push(new Date(b.getTime()+i*86400000));}return a;};
const dayIdx=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000);
function seed(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
function genTrains(date,frm,to){const rnd=seed(date+frm+to),now=new Date(),day=new Date(date+'T00:00:00');
 const dist=Math.max(1,Math.abs(ST.findIndex(x=>x[0]==to)-ST.findIndex(x=>x[0]==frm))),out=[];
 for(let i=0;i<5;i++){const dep=new Date(day.getTime()+(11*60+24+i*67+Math.floor(rnd()*20))*60000);
  const dur=8+6*dist,arr=new Date(dep.getTime()+dur*60000);
  if(dep.toDateString()===now.toDateString()&&(dep-now)<45*60000)continue;
  const b=64+14*dist;out.push({no:'G'+(5800+Math.floor(rnd()*180)+i),dep:hm(dep),arr:hm(arr),dur:dur,dt:dep.toISOString(),f:{'一等座':Math.round(b*1.59),'二等座':b}});}
 return out;}
function genId(t){const R=n=>Math.floor(Math.random()*n);
 if(t.includes('居民身份證')||t.includes('居住證'))return String(R(900000)+100000)+'********'+String(R(9000)+1000);
 if(t.includes('來往內地'))return 'H'+String(R(100000000)).padStart(8,'0');
 if(t.includes('來往大陸'))return String(R(100000000)).padStart(8,'0');
 return 'E'+String(R(100000000)).padStart(8,'0');}
const getO=()=>JSON.parse(localStorage.getItem('wk_orders')||'[]');
const setO=a=>localStorage.setItem('wk_orders',JSON.stringify(a));
function saveO(o){const a=getO(),i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);setO(a);}
const slipHTML=o=>`<div style="width:72mm;margin:0 auto;font-size:12px;line-height:1.5">
<b style="font-size:15px">香港西九龍站 高速鐵路<br>「行程信息提示」</b><hr>
訂單編號：${o.no}<br>列印時間：${new Date().toLocaleString('zh-HK')}<br>
乘車日期：${o.travel_date}<br>車　　次：${o.train_no}<br>
出發站：${o.from_station}　${o.dep_time}<br>到達站：${o.to_station}　${o.arr_time}<br>
車廂等級：${o.coach_class}<br>車票數量：${o.qty} 張<br>總　　額：HKD ${o.total}<hr>
乘車人證件資料：<br>${o.passengers.map((p,i)=>(i+1)+'. '+p.id_type+'　'+p.id_no).join('<br>')}
${o.free_children.length?`<br>免費乘車小童：<br>${o.free_children.map((c,i)=>(i+1)+'. '+c.id_type+'　'+c.id_no).join('<br>')}`:''}
<hr><b>注意：「行程信息提示」只供參考，不能憑此乘車。<br>在列車開出前可重複領取，而於車站售票機只限印發兩次。</b></div>`;
const receiptHTML=()=>`<div style="width:72mm;margin:0 auto;font-size:12px;line-height:1.6">
<b style="font-size:15px">香港西九龍站 高速鐵路<br>收據</b><hr>
茲收到購票款項。<br>金額：HKD 100.00<br>付款方式：模擬付款<hr>
此收據只供演示用途。<br>購票收據只能在購買該車票的售票機領取，完成交易後不能再次列印。</div>`;
const doPrint=h=>{document.getElementById('printArea').innerHTML=h;window.print();};

function unsup(t){setBar(bb('back'));go(`
 <div class="panel" style="left:30px;top:40px;right:30px;height:780px;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <p style="font-size:36px;color:#333">${t}</p>
  <button class="btn" style="margin-top:40px" onclick="home()">確定</button>
 </div>`);}
function notice(t){go(`<div class="modal"><div class="mbox"><p style="font-size:24px;margin-bottom:24px">${t}</p><button class="btn" onclick="home()">確定</button></div></div>`);}

function home(){S={};setBar('');go(`
 <div class="hgrid">
  <button class="hb green" style="grid-column:1/3" onclick="pdpa(1)"><img class="ic" src="img/btn-buy.png">購買車票</button>
  <button class="hb" onclick="unsup('本設備暫不支持辦理靈活行')"><img class="ic" src="img/btn-flex.png">靈活行</button>
  <button class="hb tall" onclick="unsup('本設備暫不支持打印報銷憑證')"><img class="ic" src="img/btn-reimburse.png">領取報銷憑證</button>
  <button class="hb" onclick="S.cf=0;childFlow()"><img class="ic" src="img/btn-child.png">免費乘車兒童</button>
  <button class="hb yellow" style="grid-column:2/4" onclick="recollect()"><img class="ic" src="img/btn-slip.png">領取行程信息提示</button>
  <button class="btn lang" onclick="unsup('本設備暫不支持切換語言')">繁體/English</button>
 </div>`);}
function back(){if(S.step=='date')s1();else if(S.step==1)home();else if(S.step==2)s1();else if(S.step==3)s2();else home();}

const PDPA=["閣下所提供的個人資料（下稱「資料」）將會被收集及處理，用於處理購票、登記乘車人證件及列印車票相關用途。如未能提供所需資料，本機或無法完成購票程序。","資料將於列車開出後30天內銷毀。閣下可於車站客務中心查閱或更正所提供的資料。證件掃瞄紀錄僅用於核對乘車人身份，不會用於任何其他用途。","如閣下不接受本聲明，將無法於售票機完成購票。詳情可致電客務熱線 852 21200888 或瀏覽 www.mtr.com.hk/highspeed 查詢。"];
function pdpa(p){setBar(bb('back'));go(`
 <div class="pdwrap"><div class="pdpa"><span class="pnum">${p}/3</span>
  <h3>收集個人資料聲明 （下稱「聲明」）</h3><p>${PDPA[p-1]}</p></div>
  <span class="side" onclick="pdpa(${Math.min(3,p+1)})">下一頁</span></div>
 <div class="pdbtns"><button class="btn" style="margin-right:40px" onclick="home()">不接受</button><button class="btn orange" onclick="s1()">接受</button></div>`);}

function s1(){S.step=1;S.dir=S.dir||'out';S.main=S.main||'福田';S.date=S.date||fmt(new Date());S.field=S.field||'to';setBar(bb('back'));
 const dep=S.dir=='out'?'香港西九龍':S.main,arr=S.dir=='out'?S.main:'香港西九龍';
 const gridSel=S.field=='from'?dep:arr;
 go(`<div class="panel" style="left:30px;top:40px;width:640px;height:780px"><span class="tab">車站</span>
  <div class="sgrid">${ST.map(s=>`<div class="st ${gridSel==s[0]?'sel':''}" onclick="pickSt('${s[0]}')">${s[0]}<small>${s[1]}</small></div>`).join('')}</div>
  <div style="text-align:center;margin-top:22px"><button class="btn" onclick="s1()">下一頁</button></div></div>
 <div class="rcol" style="left:720px;top:40px">
  <div class="lb">出發站</div><div class="fbox ${S.field=='from'?'sel':''}" onclick="S.field='from';s1()">${dep}<small>&nbsp;</small></div>
  <div class="lb">到達站</div><div class="fbox ${S.field=='to'?'sel':''}" onclick="S.field='to';s1()">${arr}<small>&nbsp;</small></div>
  <div class="lb">出發日期</div><div class="fbox ${S.field=='date'?'sel':''}" onclick="S.field='date';pickDate()">${S.date}</div>
 </div>
 <button class="btn" style="position:absolute;top:800px;left:720px;width:230px" onclick="S.cw=null;S.sel=null;s2()">下一步</button>`);}
function pickSt(s){
 if(S.field=='from'){if(s=='香港西九龍'){S.dir='out';}else{S.main=s;S.dir='in';}}
 else{if(s=='香港西九龍'){S.dir='in';}else{S.main=s;S.dir='out';}}
 s1();}
function pickDate(){S.step='date';setBar(bb('back'));
 go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px"><p style="margin:20px;font-size:22px">選擇15天內出發的日子：</p>
 <div class="sgrid" style="padding-top:10px">${day15().map(d=>`<div class="st ${S.date==fmt(d)?'sel':''}" onclick="S.date='${fmt(d)}';s1()">${fmt(d).slice(5).replace('-','/')}</div>`).join('')}</div></div>`);}

/* ===== 步驟二：日期籌鎖定15天、下一頁到尾禁用 ===== */
function s2(){S.step=2;
 if(S.cw==null||S.cw===undefined){const i=dayIdx(S.date);S.cw=Math.min(11,Math.max(0,Math.floor(i/4)*4));}
 if(S.cw<0)S.cw=0;if(S.cw>11)S.cw=11;
 S.trains=genTrains(S.date,S.dir=='out'?'香港西九龍':S.main,S.dir=='out'?S.main:'香港西九龍');setBar(bb('back'));
 const chips=day15().slice(S.cw,S.cw+4);
 go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px">
  ${S.trains.map((t,i)=>`<div class="trow ${S.sel==i?'sel':''}" onclick="S.sel=${i};s2b()">
   <b style="width:100px">${t.no}</b>
   <span style="width:150px">${S.dir=='out'?'香港西九龍':S.main}<br>${t.dep}</span>
   <span class="ar">⟶<br>${t.dur}分鐘</span>
   <span style="width:120px">${S.dir=='out'?S.main:'香港西九龍'}<br>${t.arr}</span>
   <span style="flex:1;text-align:center">一等座<br>${t.f['一等座'].toFixed(2)}</span>
   <span style="flex:1;text-align:center">二等座<br>${t.f['二等座'].toFixed(2)}</span></div>`).join('')||'<p style="padding:30px">該日沒有可選的車次</p>'}
  <div style="text-align:center;margin-top:16px">${chips.map((d,i)=>`<span class="chip ${S.date==fmt(d)?'sel':''}" onclick="S.date='${fmt(d)}';S.sel=null;s2()">${fmt(d).slice(5).replace('-','/')}<b>${S.cw+i+1}</b></span>`).join('')}
  <button class="btn" style="padding:10px 26px" ${S.cw+4>=15?'disabled':''} onclick="S.cw+=4;s2()">下一頁</button></div></div>`);}

function s2b(){S.step=3;S.cls=S.cls||'二等座';S.adult=S.adult||1;S.child=S.child||0;setBar(bb('back'));
 const t=S.trains[S.sel];
 go(`<div class="panel" style="left:30px;top:40px;width:1180px;height:780px">
  <p class="red" style="text-align:center;margin:20px">如您要購買多於9張車票，請往購票處購買</p>
  <div class="qty">成人票 <button class="circ" onclick="S.adult=Math.max(1,S.adult-1);s2b()">−</button><span class="nbox">${S.adult}</span><button class="circ" onclick="if(S.adult+S.child<9)S.adult++;s2b()">＋</button></div>
  <div class="qty">小童票 ${S.child>0?'<button class="circ" onclick="S.child=Math.max(0,S.child-1);s2b()">−</button>':''}<span class="nbox">${S.child}</span><button class="circ" onclick="if(S.adult+S.child<9)S.child++;s2b()">＋</button></div>
 </div>
 <div class="rcol" style="left:1250px;top:40px;width:300px">
  <div class="cls ${S.cls=='一等座'?'sel':''}" onclick="S.cls='一等座';s2b()">一等座 <small>(HK$ ${t.f['一等座'].toFixed(2)})</small></div>
  <div class="cls ${S.cls=='二等座'?'sel':''}" onclick="S.cls='二等座';s2b()">二等座 <small>(HK$ ${t.f['二等座'].toFixed(2)})</small></div>
  <p style="text-align:right;margin:24px 0 10px;font-size:20px">車票總數：${S.adult+S.child}張</p>
  <button class="btn" style="width:100%" onclick="startReg()">下一步</button>
 </div>`);}

function totals(){const t=S.trains[S.sel],u=t.f[S.cls],cu=Math.round(u*0.5);return {u:u,cu:cu,total:u*S.adult+cu*S.child};}
function sumBase(){const t=S.trains[S.sel],T=totals();
 return `<div style="position:absolute;left:60px;top:30px;display:flex;align-items:center;gap:30px;font-size:28px">
   <b>${S.dir=='out'?'香港西九龍':S.main}</b>
   <span style="text-align:center;font-size:18px">${t.no}<br>${S.date} ${t.dep}</span>⟶<b>${S.dir=='out'?S.main:'香港西九龍'}</b></div>
  <div class="suml" style="position:absolute;left:60px;top:140px;width:900px;height:300px">成人票 ${S.cls} ×${S.adult}${S.child?'<br>小童票 '+S.cls+' ×'+S.child:''}${(S.kids&&S.kids.length)?'<br>免費乘車小童 ×'+S.kids.length:''}</div>
  <div class="rcol" style="right:60px;top:30px;width:340px">
   <div class="lb">車票總價</div><div class="pbox">HK$ ${T.total.toFixed(2)}</div>
   <div class="lb">手續費</div><div class="pbox">HK$ 0.00</div>
   <div class="lb">優惠</div><div class="pbox">HK$ 0.00</div>
   <div class="lb">應付金額</div><div class="pbox">HK$ ${T.total.toFixed(2)}</div>
   <div style="text-align:right;margin-top:20px"><button class="btn" onclick="sum('pay')">付款</button></div></div>`;}
function sum(modal){setBar(bb('cancel'));let m='';
 if(modal=='id')m=`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">請選擇證件</p>
  <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.paxType='${t}';sum('scan')"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div>
  <div style="text-align:center"><button class="btn" onclick="sum(null)">取消</button></div></div></div>`;
 if(modal=='scan')m=`<div class="modal"><div class="mbox"><p style="font-size:24px;margin-bottom:24px">請於相關閱讀器掃瞄證件/刷卡</p><div style="text-align:center"><button class="btn" onclick="sum(null)">取消交易</button></div></div></div>`;
 if(modal=='pay')m=`<div class="modal"><div class="mbox"><div class="idg">
  <button class="idb" onclick="paying('支付寶')"><img class="ic" src="img/pay-alipay.png">支付寶</button>
  <button class="idb" onclick="paying('微信支付')"><img class="ic" src="img/pay-wechat.png">微信支付</button>
  <button class="idb" onclick="paying('感應式信用卡')"><img class="ic" src="img/pay-card.png">感應式信用卡</button></div>
  <div style="text-align:center"><button class="btn" onclick="sum(null)">取消交易</button></div></div></div>`;
 if(modal=='card')m=`<div class="modal"><div class="mbox"><p style="font-size:24px">如使用感應式信用卡，請放在指定讀卡器（模擬）</p></div></div>`;
 if(modal=='child')m=`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">登記免費乘車小童：請選擇證件</p>
  <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.kidType='${t}';sum('childscan')"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div>
  <div style="text-align:center"><button class="btn" onclick="sum(null)">取消</button></div></div></div>`;
 if(modal=='childscan')m=`<div class="modal"><div class="mbox"><p style="font-size:24px">請跟隨指示掃瞄小童的證件（模擬）</p></div></div>`;
 go(sumBase()+
  (!modal?`<div style="position:absolute;left:60px;bottom:40px"><button class="btn" ${((S.kids||[]).length)>=S.adult?'disabled':''} onclick="sum('child')">添加免費乘車兒童</button></div>`:'')+m);
 if(modal=='scan')setTimeout(function(){S.pax.push({id_type:S.paxType,id_no:genId(S.paxType)});S.paxType=null;S.pi++;
   if(S.pi<S.adult+S.child){sum('id');}else{sum(null);}},2500);
 if(modal=='childscan')setTimeout(function(){S.kids=S.kids||[];S.kids.push({id_type:S.kidType,id_no:genId(S.kidType)});S.kidType=null;sum(null);},2500);
 if(modal=='card')setTimeout(function(){printing();},2500);}
function startReg(){S.pax=[];S.pi=0;S.kids=S.kids||[];sum('id');}
function paying(m){S.pay=m;if(m=='感應式信用卡'){sum('card');}else{setBar(bb('cancel'));go(sumBase()+`<div class="modal"><div class="mbox"><p style="font-size:24px">請以${m}掃瞄螢幕 QR Code（模擬）</p></div></div>`);setTimeout(function(){printing();},2500);}}

function printing(){const t=S.trains[S.sel],T=totals();
 const o={id:Date.now(),no:'',created_at:new Date().toLocaleString('zh-HK'),travel_date:S.date,
  from_station:S.dir=='out'?'香港西九龍':S.main,to_station:S.dir=='out'?S.main:'香港西九龍',
  train_no:t.no,dep_time:t.dep,arr_time:t.arr,dep_dt:t.dt,coach_class:S.cls,qty:S.adult+S.child,
  unit_price:T.u,total:T.total,payment_method:S.pay,passengers:S.pax,free_children:S.kids||[],
  slipPrints:0,receiptPrinted:false};
 o.no='WK'+S.date.replace(/-/g,'')+String(o.id).slice(-4);saveO(o);
 setBar(bb('cancel'));
 go(sumBase()+`<div class="modal"><div class="mbox" style="min-width:640px">
  <p style="font-size:24px;margin:14px 0">共列印1張行程信息提示</p>
  <p style="font-size:24px;margin:14px 0">正在為您列印第 <b style="font-size:38px;color:#f08c1e">1</b> 張</p>
  <p style="font-size:24px;margin:14px 0">尚有 0 張未列印</p><div style="text-align:right"><img class="ic" src="img/printer.png"></div></div></div>`);
 doPrint(slipHTML(o));o.slipPrints=1;saveO(o);
 setTimeout(function(){doPrint(receiptHTML());o.receiptPrinted=true;saveO(o);},1500);
 setTimeout(function(){home();},4000);}

function recollect(){setBar(bb('back'));const a=getO().slice().reverse().slice(0,8);
 go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px">
 <p style="margin:10px;font-size:22px">請選擇要領取的訂單（開車前可重複領取，只限印發兩次；不會列印收據）</p>
 ${a.map(o=>{const ok=o.slipPrints<2&&new Date(o.dep_dt)>new Date();
  return `<button class="btn" style="display:block;width:100%;margin:10px 0" ${ok?'':'disabled'} onclick="reprint(${o.id})">${o.no}　${o.travel_date} ${o.train_no}（已印 ${o.slipPrints}/2）</button>`;}).join('')||'<p style="margin:14px">沒有訂單</p>'}
 </div>`);}
function reprint(id){const o=getO().find(x=>x.id===id);
 go(`<div class="modal"><div class="mbox"><p style="font-size:24px;margin:14px 0">共列印1張行程信息提示</p><p style="font-size:24px;margin:14px 0">正在為您列印第 <b style="font-size:38px;color:#f08c1e">${o.slipPrints+1}</b> 張</p><p style="font-size:24px;margin:14px 0">尚有 0 張未列印</p></div></div>`);
 doPrint(slipHTML(o));o.slipPrints++;saveO(o);setTimeout(function(){recollect();},2500);}

function childFlow(){const os=getO().slice().reverse().slice(0,8);setBar(bb('back'));
 if(!S.cf){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">無論於任何購票途徑購票時，如未有登記同行免費乘車小童，亦可於售票機後補登記手續</p><button class="btn" onclick="S.cf=1;childFlow()">添加</button></div>`);return;}
 if(!S.cfOrder){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">步驟一：選擇同行成人車票</p>
  ${os.map(o=>`<button class="btn" style="display:block;width:100%;margin:10px 0" onclick="S.cfOrder=${o.id};S.paxType=null;S.cfScan1=0;S.cfScan2=0;S.kidType=null;childFlow()">${o.no} ${o.travel_date} ${o.train_no} ×${o.qty}</button>`).join('')||'<p>沒有訂單</p>'}</div>`);return;}
 if(!S.cfScan1){
  if(!S.paxType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">選擇同行成人購票時的證件類別</p>
   <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.paxType='${t}';childFlow()"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請於相關閱讀器掃瞄證件/刷卡（模擬）</p></div></div>`);
  setTimeout(function(){S.cfScan1=1;S.paxType=null;childFlow();},2500);return;}
 if(!S.cfScan2){
  if(!S.kidType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">步驟二：登記同行小童證件</p>
   <div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.kidType='${t}';childFlow()"><img class="ic" src="img/id-card.png">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請跟隨指示掃瞄小童的證件（模擬）</p></div></div>`);
  setTimeout(function(){const o=getO().find(x=>x.id===S.cfOrder);
   if(o.free_children.length>=o.qty){S.kidType=null;notice('每位18歲或以上的旅客只可登記一位免費乘車小童');return;}
   o.free_children.push({id_type:S.kidType,id_no:genId(S.kidType)});saveO(o);S.kidType=null;S.cfScan2=1;childFlow();},2500);return;}
 setBar(bb('back'));go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:24px">步驟三：完成添加<br>完成程序後請取回證件</p><button class="btn" onclick="home()">確定</button></div>`);}
home();
</script>
</body>
</html>
