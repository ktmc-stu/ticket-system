function fareFor(st,cls,child,special,trainNo){
    if (trainNo && SLEEPER_FARES_RMB[trainNo] && SLEEPER_FARES_RMB[trainNo][st]) {
        const prices = SLEEPER_FARES_RMB[trainNo][st];
        let rmbPrice = 0;
        if (cls === '二等座') rmbPrice = prices[0];
        else if (cls === '動臥') rmbPrice = prices[1];
        else if (cls === '特等座' || cls === '一等座') rmbPrice = prices[2];
        else if (cls === '商務座' || cls === '優選一等座') rmbPrice = prices[3];
        else return null;
        if (!rmbPrice) return null;
        let hkd = Math.round(rmbPrice * 1.1);
        if (child) hkd = Math.round(hkd * 0.5);
        return hkd;
    }
    const f=special?(SPECIAL_FARE[st]||FARE[st]||null):(FARE[st]||null);
    if(!f)return null;
    const idx=CLASS_IDX[cls];
    if(idx===undefined)return null;
    if (cls === '動臥') return null;
    return f[idx+(child?5:0)];
}

function hasClass(st,cls,special,trainNo){
 return fareFor(st,cls,false,special,trainNo)!==null;
}

function hasClassForTrain(no, st, cls, special) {
  if (/^G(89|90)\d/.test(no)) {
      if (cls === '二等座' || cls === '特等座' || cls === '動臥') {
          return hasClass(st, cls, special, no);
      }
      return false;
  }
  if (!hasClass(st, cls, special, no)) return false;
  if (cls === '動臥') return false;
  if (cls === '商務座') {
    return /^G(3|9)\d/.test(no) || no.indexOf('G60') === 0 || no.indexOf('G61') === 0;
  }
  if (cls === '特等座' || cls === '優選一等座') {
    return /^G(3|9)\d/.test(no);
  }
  return true;
}

function trainsFor(date,frm,to){
  const now=new Date();now.setHours(0,0,0,0);
  const realNow=new Date();
  const out=[];
  TT.forEach(x=>{
    if(!x.t[frm]||!x.t[to])return;
    let a=tm(x.t[frm]),b=tm(x.t[to]);
    if(!x.sleeper && b < a) return;
    
    if (x.sleeper) {
        const parts=date.split('-');
        const dObj=new Date(parts[0],parts[1]-1,parts[2]);
        const day=dObj.getDay();
        if (day!==0 && day!==1 && day!==5 && day!==6) return;
        if((frm==='香港西九龍'&&(to==='深圳北'||to==='廣州南'))||(to==='香港西九龍'&&(frm==='深圳北'||frm==='廣州南')))return;
        if(x.n==='G899'&&frm==='寧波')return;
    }

    if(b<a)b+=1440;
    if(b<=a)return;
    const parts=date.split('-');
    const dep=new Date(parts[0],parts[1]-1,parts[2]);
    dep.setHours(Math.floor(a/60), a%60, 0, 0);
    
    if(dep.toDateString()===realNow.toDateString()&&(dep-realNow)<45*60000)return;
    out.push({no:x.n,dep:x.t[frm],arr:x.t[to],dur:b-a,dt:dep.toISOString(),special:!!x.special,sleeper:!!x.sleeper});
  });
  out.sort((p,q)=>tm(p.dep)-tm(q.dep));
  return out;
}

 if(t.includes('居民身份證')||t.includes('居住證'))return String(R(900000)+100000)+'********'+String(R(9000)+1000);
 if(t.includes('來往內地'))return 'H'+String(R(100000000)).padStart(8,'0');
 if(t.includes('來往大陸'))return String(R(100000000)).padStart(8,'0');
 return 'E'+String(R(100000000)).padStart(8,'0');}

const PDPA=["閣下所提供的乘車人個人資料（定義見下文）將被香港鐵路有限公司（下稱「港鐵公司」或「我們」）用於 (1) 處理及管理高速鐵路（下稱「高鐵」）的購票交易(包括發出及/或印發有效的高鐵車票、印發為電子車票所發出以記錄行程資料及/或作為憑證的乘車人文件、辦理改票、退票、報失及補領實體車票、補票手續及/或用作投訴及/或調查的參考依據)；(2) 查驗車票時核實乘車人的個人身份及資格；(3) 管理及營運高鐵服務；(4) 調查與高鐵服務有關的投訴、事故、意外或進行任何與高鐵服務有關的刑事、民事、行政或其他法律程序；(5) 遵從適用的法律或監管要求 (包括但不限於香港及中國內地適用的法律或監管要求)；及 (6) 遵從政府部門、行政或監管機構的要求及/或與它們就任何調查合作(下稱「該目的」)。為核實乘車人的個人身份，乘車人的完整姓名及身份證明文件部分號碼、字母及/或字樣 (視情況而定) 必須列印在實體車票上。","閣下必須向我們提供乘車人的行程資料 (如到發車站、列車班次、時間及車廂等級等)、付款資料、有效身份證明文件上顯示的全名、出生日期、國籍、證件類別、證件全部號碼及有效期限，並出示乘車人的有效身份證明文件正本或複印本 (視情況而定) (「個人資料」)。如閣下未能提供以上所述真確的個人資料，我們將不會發出車票。如閣下並非乘車人而向我們提供乘車人的個人資料，即代表閣下確認閣下已向乘車人提供本聲明的副本，而乘車人已閱讀並同意載列其中的所有條款，以及閣下獲乘車人授權向我們提供所有該等個人資料。","有效身份證明文件指港澳居民來往內地通行證、台灣居民來往大陸通行證、中華人民共和國居民身份證、中華人民共和國港澳居民居住證、中華人民共和國台灣居民居住證、中華人民共和國外國人永久居留身份證、中華人民共和國往來港澳通行證、符合中華人民共和國規定可使用的有效護照或港鐵公司接受的其他有效身份證明文件。閣下所提供的乘車人個人資料將會轉移至香港境外，交予在中國內地的高鐵運營商 (下稱「內地铁路運營商」) 及/或代表內地铁路運營商處理個人資料的代理人、承辦商、業務夥伴或第三方服務供應商，用以實行該目的。由於內地铁路運營商位於中國內地，受中華人民共和國法律約束，因此內地铁路運營商會根據中華人民共和國法律使用及披露閣下的個人資料，而其保障程度可能與香港個人資料私隱法律之下不同。在我們處理閣下的購票交易前，閣下必須同意或獲乘車人授權同意我們將閣下的乘車人個人資料轉移至香港境外的鐵路運營商。為該目的，我們亦可能將閣下所提供的乘車人個人資料轉移給我們提供行政、電腦及其他服務並代表我們按照該目的處理個人資料的代理人、承辦商、業務夥伴或第三方服務供應商 (下稱「服務供應商」)，以及其他獲法例授權而要求取得有關資料的人士。我們的服務供應商可能位於沒有與《個人資料 (私隱) 條例》大致相似或用途相同的資料保護法律的香港境外的地方。根據《個人資料 (私隱) 條例》，乘車人有權要求查閱及更正閣下所提供的乘車人個人資料。更正乘車人個人資料的申請，可向香港西九龍站詢問處提出。倘須查閱乘車人個人資料，可致函予以下人士及地址：個人資料私隱主任，香港鐵路有限公司，法律－常務部，香港九龍九龍灣德福廣場港鐵總部大樓 (註明：「高速鐵路」)。"];

 if(S.field=='from'){if(s=='香港西九龍'){S.dir='out';}else{S.main=s;S.dir='in';}}

function pickDate(){
  S.step='date';
  setBar(bb('back'));
  renderCalendar();
}

function renderCalendar(){
  const now=new Date();now.setHours(0,0,0,0);
  const maxD=new Date(now.getTime()+14*86400000);
  
  const year=calYear;
  const month=calMonth;
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const daysInMonth=lastDay.getDate();
  const startWeekday=firstDay.getDay();
  
  const canPrev = (calYear > now.getFullYear() || (calYear === now.getFullYear() && calMonth > now.getMonth()));
  const canNext = (calYear < maxD.getFullYear() || (calYear === maxD.getFullYear() && calMonth < maxD.getMonth()));
  
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const weekDays=['日','一','二','三','四','五','六'];
  
  let daysHTML='';
  for(let i=0;i<startWeekday;i++){
    daysHTML+=`<div class="cal-day empty"></div>`;
  }
  
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(year,month,d);
    const dateStr=fmt(date);
    const isPast=date<now;
    const isFuture=date>maxD;
    const disabled=isPast||isFuture;
    const sel=S.date===dateStr?'sel':'';
    const cls=disabled?'past':sel;
    const onclick=disabled?'':`onclick="S.date='${dateStr}';s1()"`;
    daysHTML+=`<div class="cal-day ${cls}" ${onclick}>${d}${sel?'<small>✓</small>':''}</div>`;
  }
  
  const navHTML=`
    <div class="cal-nav">
      <button class="btn mini" ${canPrev?'':'disabled'} onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar()">◀ 上月</button>
      <button class="btn mini" ${canNext?'':'disabled'} onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar()">下月 ▶</button>
    </div>`;
  
  go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:30px">
    <div class="cal-header">
      <div class="cal-title">${year}年 ${monthNames[month]}</div>
      ${navHTML}
    </div>
    <div class="cal-weekdays">${weekDays.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-days">${daysHTML}</div>
    <div style="text-align:center;margin-top:20px">
      <p style="font-size:16px;color:#666">灰色日期為不可選日期（已過或超出15天預售期）</p>
      <p style="font-size:16px;color:#666">臥鋪列車僅於星期五、六、日、一運行</p>
    </div>
  </div>`);
}

 const per=5,tpages=Math.max(1,Math.ceil(S.trains.length/per));

   return `<div class="trow ${S.sel==S.tp*per+i?'sel':''}" onclick="S.sel=${S.tp*per+i};s2b()">

 if(modal=='card')setTimeout(function(){printing();},2500);}
function startReg(){S.pax=[];S.pi=0;S.kids=S.kids||[];sum('id');}
function paying(m){S.pay=m;if(m=='感應式信用卡'){sum('card');}else{setBar(bb('cancel'));go(sumBase()+`<div class="modal"><div class="mbox"><p style="font-size:24px">請以${m}掃瞄螢幕 QR Code（模擬）</p></div></div>`);setTimeout(function(){printing();},2500);}}
async function printing(){const t=S.trains[S.sel],T=totals();
 const o={id:Date.now(),no:'',created_at:new Date().toLocaleString('zh-HK'),travel_date:S.date,from_station:S.dir=='out'?'香港西九龍':S.main,to_station:S.dir=='out'?S.main:'香港西九龍',train_no:t.no,dep_time:t.dep,arr_time:t.arr,dep_dt:t.dt,coach_class:S.cls,qty:S.adult+S.child,unit_price:T.u,total:T.total,payment_method:S.pay,passengers:S.pax,free_children:S.kids||[],slipPrints:0,receiptPrinted:false,special:t.special};
 o.no='WK'+S.date.replace(/-/g,'')+String(o.id).slice(-4);saveO(o);
 setBar(bb('cancel'));
 go(sumBase()+printModalHTML(1,1,0));
 await slipPrintRaw();o.slipPrints=1;saveO(o);
 await wait(4000);
 go(sumBase()+receiptModalHTML());
 await receiptPrint();o.receiptPrinted=true;saveO(o);
 await wait(1000);
 await showNoticeModal("請取走票據和證件", 1000);
 home();}

<!-- 在 childFlow 函數中已包含證件類型選擇，現將 recollect 功能統一化 -->

function startRecollectScan(){
    setBar(bb('cancel'));
    // 先顯示證件類型選擇，而非直接掃描
    go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">請選擇證件</p><div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.recollectType='${t}';startRecollectScan2()"><img src="${getIdIcon(t)}">${t}</button>`).join('')}</div></div></div>`);
}

function startRecollectScan2(){
    setBar(bb('cancel'));
    go(`<div class="modal"><div class="mbox"><p style="font-size:24px;margin-bottom:24px">請於相關閱讀器掃瞄證件</p><div style="text-align:center"><button class="btn" onclick="home()">取消</button></div></div></div>`);
    setTimeout(async function(){
        await showNoticeModal("請取回證件", 1000);
        S.pick = {};
        showRecollectList();
    }, 2500);
}

// 修改 showRecollectList 函數，確保正確使用選擇的證件類型
function showRecollectList(){
    setBar(bb('back'));
    const a=getO().slice().reverse().slice(0,8);
    const now = new Date();
    const validOrders = a.filter(o => new Date(o.dep_dt) > now);
    const ids=Object.keys(S.pick||{}).filter(k=>S.pick[k]);
    go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:10px;font-size:22px">請選擇要領取的訂單</p>${validOrders.map(o=>{const ok=o.slipPrints<2;const on=!!S.pick[o.id];return `<button class="btn" style="display:block;width:100%;margin:10px 0;${on?'background:#f08c1e':''}" ${ok?'':'disabled'} onclick="togPick(${o.id})">${on?'✔ ':''}${o.no} ${o.travel_date} ${o.train_no}（已印 ${o.slipPrints}/2）</button>`;}).join('')||'<p style="margin:14px">沒有可領取的訂單</p>'}${ids.length?`<button class="btn orange" style="margin-top:16px" onclick="startQueue()">確認列印（${ids.length}張）</button>`:''}</div>`);
}

// 修改 childFlow 函數中的證件掃描部分，保持一致性
function childFlow(){const os=getO().slice().reverse().slice(0,8);setBar(bb('back'));
 if(!S.cf){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">無論於任何購票途徑購票時，如未有登記同行免費乘車小童，亦可於售票機後補登記手續</p><button class="btn" onclick="S.cf=1;childFlow()">添加</button></div>`);return;}
 if(!S.cfOrder){go(`<div class="panel" style="left:30px;top:40px;right:30px;height:780px;padding:20px"><p style="margin:16px;font-size:22px">步驟一：選擇同行成人車票</p>${os.map(o=>`<button class="btn" style="display:block;width:100%;margin:10px 0" onclick="S.cfOrder=${o.id};S.paxType=null;S.cfScan1=0;S.cfScan2=0;S.kidType=null;childFlow()">${o.no} ${o.travel_date} ${o.train_no} ×${o.qty}</button>`).join('')||'<p>沒有訂單</p>'}</div>`);return;}
 if(!S.cfScan1){
  if(!S.paxType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">選擇同行成人購票時的證件類別</p><div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.paxType='${t}';childFlow()"><img src="${getIdIcon(t)}">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請於相關閱讀器掃瞄證件/刷卡（模擬）</p></div></div>`);
  setTimeout(async function(){await showNoticeModal("請取回證件", 1000);S.cfScan1=1;S.paxType=null;childFlow();},2500);return;}
 if(!S.cfScan2){
  if(!S.kidType){setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="text-align:center;font-size:22px">步驟二：登記同行小童證件</p><div class="idg">${IDS.map(t=>`<button class="idb" onclick="S.kidType='${t}';childFlow()"><img src="${getIdIcon(t)}">${t}</button>`).join('')}</div></div></div>`);return;}
  setBar(bb('cancel'));go(`<div class="modal"><div class="mbox"><p style="font-size:24px">請跟隨指示掃瞄小童的證件（模擬）</p></div></div>`);
  setTimeout(async function(){
      await showNoticeModal("請取回證件", 1000);
      const o=getO().find(x=>x.id===S.cfOrder);
      if(o.free_children.length>=o.qty){S.kidType=null;notice('每位18歲或以上的旅客只可登記一位免費乘車小童');return;}
      o.free_children.push({id_type:S.kidType,id_no:genId(S.kidType)});
      saveO(o);S.kidType=null;S.cfScan2=1;
      
      setBar(bb('cancel'));
      go(`<div class="modal"><div class="mbox" style="min-width:640px"><p style="font-size:24px;margin:14px 0">登記成功，正在為您列印兒童行程信息提示...</p><div style="text-align:right"><img style="width:120px;height:120px;object-fit:contain" src="img/printer.png"></div></div></div>`);
      await slipPrintRaw();
      await wait(2000);
      await showNoticeModal("請取走票據和證件", 1000);
      home();
  },2500);return;}
}
home();
</script>
